<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://anshory1972.github.io/dataslide/lpdp2026/21.html">
<meta name="robots" content="noindex">
<title>Terima kasih</title>
<style>
  :root {
    color-scheme: light dark;
    --paper:#f4f2ed; --surface:#fffdf9; --ink:#14161c; --muted:#6d6a63; --rule:#dcd8ce; --accent:#b4451f; --slate:#1c4e73;
  }
  @media screen and (prefers-color-scheme: dark) {
    :root { --paper:#0f1013; --surface:#191a1e; --ink:#ece9e2; --muted:#9b978e; --rule:#2e3036; --accent:#e0875f; --slate:#7ea9cc; }
  }
  *, *::before, *::after { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--paper); overflow:hidden; }
  .stage { position:absolute; left:0; top:0; width:1600px; height:900px; transform-origin:0 0; color:var(--ink);
           font-family: system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  .art { position:absolute; left:760px; top:0; width:840px; height:900px;
         background:url('cover-80e273cd.jpg') 72% 50% / cover no-repeat; }
  .art::before { content:''; position:absolute; inset:0 auto 0 0; width:180px;
         background:linear-gradient(90deg, var(--paper), transparent); }
  .event { position:absolute; left:80px; top:96px; font-size:14px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
  h1 { position:absolute; left:80px; top:250px; width:640px; margin:0; font: 400 96px/1.1 Georgia,"Iowan Old Style",serif; letter-spacing:-.015em; }
  h1 em { color:var(--accent); }
  .rule { position:absolute; left:80px; top:470px; width:72px; height:3px; background:var(--accent); }
  .who { position:absolute; left:80px; top:500px; width:620px; }
  .who b { display:block; font: 400 30px Georgia,serif; }
  .who span { display:block; font-size:17px; line-height:1.5; color:var(--muted); margin-top:8px; }
  .when { position:absolute; left:80px; top:760px; width:620px; font-size:15px; line-height:1.55; color:var(--muted); }
  .when b { color:var(--ink); font-weight:600; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="art" role="img" aria-label="Woven Indonesian cloth with a gold band of houses, rice plants and people holding hands"></div>
  <div class="event">LPDP Career Monitoring · Kementerian Keuangan</div>
  <h1><em>Terima kasih</em></h1>
  <div class="rule"></div>
  <div class="who"><b>Arief Anshory Yusuf</b>
    <span>Member, National Economic Council (Dewan Ekonomi Nasional)<br>Professor of Economics, Universitas Padjadjaran</span></div>
  <div class="when"><b>Wednesday, 18 November 2026</b><br>Session: Transformasi Digital, Ekonomi Hijau, dan Pembangunan Inklusif</div>
</div>
<script>
  const st = document.getElementById('stage');
  const fit = () => { const k = Math.min(innerWidth / 1600, innerHeight / 900);
    st.style.transform = `translate(${(innerWidth - 1600 * k) / 2}px, ${(innerHeight - 900 * k) / 2}px) scale(${k})`; };
  addEventListener('resize', fit); fit();
</script>
<style id="deck-nav-css">
  html, body { width:100%; height:100%; overflow:hidden; }
  .stage { position:fixed !important; }
  .dnav { position:fixed; right:14px; bottom:14px; display:flex; gap:8px; z-index:50; }
  .dnav a { width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; text-decoration:none;
            font: 400 26px/1 system-ui,sans-serif; color:#6d6a63; background:rgba(255,253,249,.72); border:1px solid rgba(109,106,99,.35);
            opacity:.55; -webkit-tap-highlight-color:transparent; }
  .dnav a:hover { opacity:1; }
  .dnav a.off { visibility:hidden; }
  @media (prefers-color-scheme: dark) { .dnav a { color:#9b978e; background:rgba(25,26,30,.72); } }
  @media print { .dnav { display:none; } }
</style>
<div class="dnav"><a href="20.html" class="" aria-label="Previous slide">&#8249;</a><a href="" class="off" aria-label="Next slide">&#8250;</a></div>
<script id="deck-nav">
  (function () {
    const prev = '20.html', next = '';
    document.addEventListener('keydown', e => {
      if (next && ['ArrowRight','PageDown',' '].includes(e.key)) location.href = next;
      if (prev && ['ArrowLeft','PageUp','Backspace'].includes(e.key)) location.href = prev;
    });
    let x0 = null, y0 = null, x1 = null, y1 = null;
    document.addEventListener('touchstart', e => { x0 = x1 = e.touches[0].clientX; y0 = y1 = e.touches[0].clientY; }, { passive: true });
    document.addEventListener('touchmove', e => { x1 = e.touches[0].clientX; y1 = e.touches[0].clientY; }, { passive: true });
    document.addEventListener('touchend', () => {
      if (x0 === null) return;
      const dx = x1 - x0, dy = y1 - y0; x0 = null;
      if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      if (dx < 0 && next) location.href = next;
      if (dx > 0 && prev) location.href = prev;
    }, { passive: true });
  })();
</script>
</body>
</html>
