<script>
  // icons inside the impact boxes use the accent colour
  document.querySelectorAll('rect.imp').forEach(r => { let n = r.nextElementSibling;
    while (n && !(n.tagName === 'path' && n.classList.contains('ic'))) n = n.nextElementSibling;
    if (n) { n.style.stroke = 'var(--accent)'; n.previousElementSibling.style.fill = 'var(--paper)'; } });
  // scale the 1600 x 900 stage to the window
  const st = document.getElementById('stage');
  const fit = () => { const k = Math.min(innerWidth / 1600, innerHeight / 900);
    st.style.transform = `translate(${(innerWidth - 1600 * k) / 2}px, ${(innerHeight - 900 * k) / 2}px) scale(${k})`; };
  addEventListener('resize', fit); fit();
</script>
<script id="deck-nav">
  // move between slides with the keyboard
  document.addEventListener('keydown', e => {
    const prev = '09.html', next = '11.html';
    if (next && ['ArrowRight','PageDown',' '].includes(e.key)) location.href = next;
    if (prev && ['ArrowLeft','PageUp','Backspace'].includes(e.key)) location.href = prev;
  });
</script>
