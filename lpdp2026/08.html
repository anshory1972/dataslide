<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="https://anshory1972.github.io/dataslide/lpdp2026/08.html">
<meta name="robots" content="noindex">
<title>In practice: registering for social assistance with Perlinsos Digital</title>
<style>
  :root {
    color-scheme: light dark;
    --paper:#f4f2ed; --surface:#fffdf9; --ink:#14161c; --muted:#6d6a63; --rule:#dcd8ce; --accent:#b4451f;
  }
  @media screen and (prefers-color-scheme: dark) {
    :root { --paper:#0f1013; --surface:#191a1e; --ink:#ece9e2; --muted:#9b978e; --rule:#2e3036; --accent:#e0875f; }
  }
  *, *::before, *::after { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--paper); overflow:hidden; }
  .stage { position:absolute; left:0; top:0; width:1600px; height:900px; transform-origin:0 0; color:var(--ink);
           font-family: Georgia,"Iowan Old Style","Palatino Linotype",serif; }
  h1 { position:absolute; left:40px; top:26px; margin:0; font-weight:400; font-size:34px; letter-spacing:-.01em; }
  h1 em { color:var(--accent); }
  .frame { position:absolute; left:176px; top:100px; width:1248px; height:702px; border-radius:14px; overflow:hidden;
           background:#000; box-shadow: 0 2px 6px rgba(0,0,0,.08), 0 18px 40px rgba(30,26,18,.14); border:1px solid var(--rule); }
  .frame iframe { width:100%; height:100%; border:0; display:block; }
  .cap { position:absolute; left:176px; width:1248px; top:818px; display:flex; justify-content:space-between; align-items:baseline;
         font: 15px system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--muted); }
  .cap b { color:var(--ink); font-weight:600; }
  .cap .play { color:var(--accent); font-weight:600; letter-spacing:.06em; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <h1><em>In practice:</em> registering for social assistance with Perlinsos Digital</h1>
  <div class="frame">
    <iframe src="https://www.youtube-nocookie.com/embed/UHUqFtKDXRg?rel=0&amp;modestbranding=1&amp;playsinline=1"
            title="Digitalisasi Perlinsos untuk Perbaiki Data Penerima Bansos (CNN Indonesia)"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>
  <div class="cap"><span><b>Video:</b> CNN Indonesia, “Digitalisasi Perlinsos untuk Perbaiki Data Penerima Bansos”</span>
    <span class="play">▶ CLICK TO PLAY · F FOR FULL SCREEN</span></div>
</div>
<script>
  // scale the 1600 x 900 stage to the window
  const st = document.getElementById('stage');
  const fit = () => { const k = Math.min(innerWidth / 1600, innerHeight / 900);
    st.style.transform = `translate(${(innerWidth - 1600 * k) / 2}px, ${(innerHeight - 900 * k) / 2}px) scale(${k})`; };
  addEventListener('resize', fit); fit();
</script>
<script id="deck-nav">
  // move between slides with the keyboard (works when the video does not have focus)
  document.addEventListener('keydown', e => {
    const prev = '07.html', next = '09.html';
    if (next && ['ArrowRight','PageDown'].includes(e.key)) location.href = next;
    if (prev && ['ArrowLeft','PageUp','Backspace'].includes(e.key)) location.href = prev;
  });
</script>
</body>
</html>
