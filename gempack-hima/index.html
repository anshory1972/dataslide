  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  async function open(pw) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(D.salt), iterations: D.it, hash: "SHA-256" },

    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(D.iv) }, key, b64(D.ct));
    return new TextDecoder().decode(plain);
  }
  function show(page) { document.open(); document.write(page); document.close(); }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) { open(saved).then(show, function () { try { localStorage.removeItem(KEY); } catch (e) {} }); }
  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pw = document.getElementById("pw").value.trim();
    open(pw).then(function (page) {
      try { localStorage.setItem(KEY, pw); } catch (e) {}
      show(page);
    }, function () { document.getElementById("err").textContent = "Kata sandi salah. Coba lagi."; });
